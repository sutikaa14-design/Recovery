name: Build RecoverX APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build RecoverX Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RecoverX source
        run: |
          set -e
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/kamaarr05-dotcom/Recovery-/main/recoverx---android-data-%26-file-recovery-enginee.zip" \
            -o recoverx-source.zip
          unzip -q recoverx-source.zip -d source
          echo "Extracted source:"
          find source -maxdepth 4 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Locate Android project
        id: locate
        run: |
          set -e
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Tidak ditemukan settings.gradle atau settings.gradle.kts."
            find source -maxdepth 5 -type f | head -200
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle wrapper --gradle-version 8.4 --distribution-type bin
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
        id: apk
        run: |
          APK="$(find "${{ steps.locate.outputs.project_dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "${{ steps.locate.outputs.project_dir }}" -type f -name "*.apk" -print
            exit 1
          fi
          echo "APK=$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RecoverX-Debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
