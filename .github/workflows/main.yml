name: Build RecoverX APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build RecoverX Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RecoverX source
        run: |
          set -e
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/kamaarr05-dotcom/Recovery-/main/recoverx---android-data-%26-file-recovery-enginee.zip" \
            -o recoverx-source.zip
          unzip -q recoverx-source.zip -d source

      - name: Locate Android project
        id: locate
        run: |
          set -e
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then exit 1; fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Inspect recovery result architecture
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          echo "===== SOURCE TREE ====="
          find app/src/main/java app/src/main/res -type f | sort | sed -n '1,260p'
          echo "===== RECOVERY/RESULT/PHOTO/VIDEO REFERENCES ====="
          grep -RniE 'recover|restore|scan result|thumbnail|preview|video|photo|image|media' app/src/main/java --include='*.kt' --include='*.java' | head -n 400 || true
          echo "===== LAYOUT/COMPOSE REFERENCES ====="
          grep -RniE 'RecyclerView|LazyVerticalGrid|LazyColumn|AsyncImage|ImageView|VideoView|ExoPlayer|Media3|Coil|Glide|BitmapFactory' app/src/main/java app/src/main/res --include='*.kt' --include='*.java' --include='*.xml' | head -n 300 || true

      - name: Inspect preview implementation details
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          echo "===== RecoverableFile.kt ====="
          cat app/src/main/java/com/recoverx/app/data/model/RecoverableFile.kt
          echo "===== PreviewScreen.kt ====="
          cat app/src/main/java/com/recoverx/app/ui/screens/PreviewScreen.kt
          echo "===== FoundFilesScreen.kt ====="
          cat app/src/main/java/com/recoverx/app/ui/screens/FoundFilesScreen.kt
          echo "===== build.gradle dependencies ====="
          grep -RniE 'coil|media3|exoplayer|videoview|compose' . --include='build.gradle' --include='build.gradle.kts' | head -n 200 || true

      - name: Add photo and video review preview
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          cat > app/src/main/java/com/recoverx/app/ui/screens/PreviewScreen.kt <<'EOF'
          package com.recoverx.app.ui.screens

          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import coil.compose.AsyncImage
          import com.recoverx.app.data.model.RecoverableFile
          import com.recoverx.app.data.model.RecoveryConfidence
          import com.recoverx.app.data.model.ScanCategory
          import com.recoverx.app.ui.theme.*
          import android.widget.MediaController
          import android.widget.VideoView

          @Composable
          fun PreviewScreen(
              file: RecoverableFile,
              onBack: () -> Unit,
              onToggleSelect: () -> Unit,
              onRecoverSingle: () -> Unit
          ) {
              val scrollState = rememberScrollState()
              val isPhoto = file.category == ScanCategory.PHOTOS
              val isVideo = file.category == ScanCategory.VIDEOS

              Scaffold(
                  containerColor = DarkBackground,
                  topBar = {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 12.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = onBack) {
                              Icon(Icons.Default.ArrowBack, "Kembali", tint = Color.White)
                          }
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(
                                  if (isVideo) "Pratinjau Video" else if (isPhoto) "Pratinjau Foto" else "Pratinjau File",
                                  fontWeight = FontWeight.Bold, color = Color.White, fontSize = 18.sp
                              )
                              Text("Sebelum dipulihkan", color = TextSecondary, fontSize = 11.sp)
                          }
                          IconButton(onClick = onToggleSelect) {
                              Icon(
                                  if (file.isSelected) Icons.Default.CheckCircle else Icons.Default.RadioButtonUnchecked,
                                  "Pilih",
                                  tint = if (file.isSelected) CyanPrimary else TextSecondary
                              )
                          }
                      }
                  },
                  bottomBar = {
                      Surface(color = DarkSurface, tonalElevation = 8.dp) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 20.dp, vertical = 14.dp),
                              horizontalArrangement = Arrangement.spacedBy(12.dp)
                          ) {
                              OutlinedButton(
                                  onClick = onToggleSelect,
                                  modifier = Modifier.weight(1f).height(48.dp),
                                  shape = RoundedCornerShape(12.dp)
                              ) { Text(if (file.isSelected) "Batalkan" else "Pilih File") }
                              Button(
                                  onClick = onRecoverSingle,
                                  modifier = Modifier.weight(1.5f).height(48.dp),
                                  shape = RoundedCornerShape(12.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = CyanPrimary, contentColor = DarkBackground)
                              ) {
                                  Icon(Icons.Default.Download, null)
                                  Spacer(Modifier.width(6.dp))
                                  Text("Pulihkan File Ini", fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              ) { innerPadding ->
                  Column(
                      modifier = Modifier.fillMaxSize().padding(innerPadding).verticalScroll(scrollState)
                          .padding(horizontal = 20.dp, vertical = 8.dp)
                  ) {
                      Card(
                          modifier = Modifier.fillMaxWidth().height(if (isVideo) 260.dp else 250.dp),
                          shape = RoundedCornerShape(16.dp),
                          colors = CardDefaults.cardColors(containerColor = Color.Black)
                      ) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              when {
                                  isPhoto && file.uri != null -> {
                                      AsyncImage(
                                          model = file.uri,
                                          contentDescription = file.name,
                                          contentScale = ContentScale.Fit,
                                          modifier = Modifier.fillMaxSize().clip(RoundedCornerShape(16.dp))
                                      )
                                  }
                                  isVideo && file.uri != null -> {
                                      AndroidView(
                                          modifier = Modifier.fillMaxSize().clip(RoundedCornerShape(16.dp)),
                                          factory = { context ->
                                              VideoView(context).apply {
                                                  val controller = MediaController(context)
                                                  controller.setAnchorView(this)
                                                  setMediaController(controller)
                                                  setVideoURI(file.uri)
                                              }
                                          }
                                      )
                                  }
                                  else -> {
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Box(
                                              Modifier.size(72.dp).clip(RoundedCornerShape(16.dp))
                                                  .background(getCategoryColor(file.category).copy(alpha = 0.18f)),
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Icon(getCategoryIcon(file.category), null,
                                                  tint = getCategoryColor(file.category), modifier = Modifier.size(40.dp))
                                          }
                                          Spacer(Modifier.height(10.dp))
                                          Text("Pratinjau visual tidak tersedia", color = Color.White, fontWeight = FontWeight.Bold)
                                          Text("File tetap dapat dianalisis/dipulihkan bila datanya valid.", color = TextSecondary, fontSize = 12.sp)
                                      }
                                  }
                              }
                          }
                      }

                      Spacer(Modifier.height(12.dp))
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Icon(
                              if (isVideo) Icons.Default.PlayCircle else if (isPhoto) Icons.Default.Visibility else Icons.Default.InsertDriveFile,
                              null, tint = CyanLight, modifier = Modifier.size(18.dp)
                          )
                          Spacer(Modifier.width(8.dp))
                          Text(
                              if (isVideo && file.uri != null) "Tekan Play untuk meninjau video"
                              else if (isPhoto && file.uri != null) "Foto ditemukan dan dapat ditinjau"
                              else "Hasil recovery perlu diperiksa setelah pemulihan",
                              color = TextSecondary, fontSize = 12.sp
                          )
                      }

                      Spacer(Modifier.height(20.dp))
                      Text("Informasi File & Recovery", style = MaterialTheme.typography.titleMedium,
                          fontWeight = FontWeight.Bold, color = Color.White)
                      Spacer(Modifier.height(10.dp))
                      Card(
                          modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp),
                          colors = CardDefaults.cardColors(containerColor = DarkSurface)
                      ) {
                          Column(Modifier.padding(16.dp)) {
                              MetaRow("Nama File", file.name)
                              Divider(color = Color(0xFF1E293B), modifier = Modifier.padding(vertical = 8.dp))
                              MetaRow("Ukuran", "${file.sizeBytes} bytes (${formatFileSize(file.sizeBytes)})")
                              Divider(color = Color(0xFF1E293B), modifier = Modifier.padding(vertical = 8.dp))
                              MetaRow("Tipe MIME", file.mimeType)
                              Divider(color = Color(0xFF1E293B), modifier = Modifier.padding(vertical = 8.dp))
                              MetaRow("Sumber", sourceLabel(file))
                              Divider(color = Color(0xFF1E293B), modifier = Modifier.padding(vertical = 8.dp))
                              MetaRow("Integritas", confidenceLabel(file.confidence))
                              if (file.originalPath.isNotEmpty()) {
                                  Divider(color = Color(0xFF1E293B), modifier = Modifier.padding(vertical = 8.dp))
                                  MetaRow("Lokasi Temuan", file.originalPath)
                              }
                          }
                      }

                      Spacer(Modifier.height(20.dp))
                      Text("Inspeksi Binary Signature", style = MaterialTheme.typography.titleMedium,
                          fontWeight = FontWeight.Bold, color = Color.White)
                      Spacer(Modifier.height(10.dp))
                      Card(
                          modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF070B12))
                      ) {
                          Column(Modifier.padding(14.dp)) {
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("Offset 0x00000000", fontFamily = FontFamily.Monospace, fontSize = 11.sp, color = CyanLight)
                                  Text("Signature terdeteksi", fontSize = 11.sp, color = AccentGreen, fontWeight = FontWeight.Bold)
                              }
                              Spacer(Modifier.height(8.dp))
                              Text(file.hexSnippet ?: "FF D8 FF E0 00 10 4A 46 49 46 00 01 01 00",
                                  fontFamily = FontFamily.Monospace, fontSize = 13.sp, fontWeight = FontWeight.SemiBold,
                                  color = Color.White, lineHeight = 20.sp)
                          }
                      }
                      Spacer(Modifier.height(24.dp))
                  }
              }
          }

          @Composable
          private fun MetaRow(label: String, value: String) {
              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                  Text(label, fontSize = 12.sp, color = TextSecondary)
                  Text(value, fontSize = 12.sp, fontWeight = FontWeight.Medium, color = Color.White, maxLines = 2)
              }
          }

          private fun sourceLabel(file: RecoverableFile): String = when (file.source.name) {
              "MEDIASTORE_TRASH" -> "MediaStore / Sampah"
              "HIDDEN_CACHE" -> "Cache / Thumbnail tersembunyi"
              "FILE_CARVING" -> "File Carving / Signature"
              "LOST_DIR" -> "LOST.DIR / Orphan"
              else -> file.source.name
          }

          private fun confidenceLabel(confidence: RecoveryConfidence): String = when (confidence) {
              RecoveryConfidence.HIGH -> "Tinggi — struktur file utuh"
              RecoveryConfidence.MEDIUM -> "Sedang — sebagian struktur diverifikasi"
              RecoveryConfidence.LOW -> "Rendah — kemungkinan fragmentasi"
          }

          private fun formatFileSize(bytes: Long): String {
              if (bytes < 1024) return "${bytes} B"
              val kb = bytes / 1024.0
              if (kb < 1024) return String.format("%.1f KB", kb)
              val mb = kb / 1024.0
              if (mb < 1024) return String.format("%.1f MB", mb)
              return String.format("%.2f GB", mb / 1024.0)
          }

          private fun getCategoryIcon(category: ScanCategory) = when (category) {
              ScanCategory.PHOTOS -> Icons.Default.Image
              ScanCategory.VIDEOS -> Icons.Default.Videocam
              else -> Icons.Default.InsertDriveFile
          }

          private fun getCategoryColor(category: ScanCategory) = when (category) {
              ScanCategory.PHOTOS -> CyanLight
              ScanCategory.VIDEOS -> Color(0xFFF43F5E)
              else -> TextSecondary
          }
          EOF
          sed -i 's/formatFileSize/previewFormatFileSize/g; s/getCategoryIcon/previewCategoryIcon/g; s/getCategoryColor/previewCategoryColor/g' app/src/main/java/com/recoverx/app/ui/screens/PreviewScreen.kt

      - name: Inspect FoundFilesScreen for thumbnail integration
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          echo "===== FoundFilesScreen.kt ====="
          cat app/src/main/java/com/recoverx/app/ui/screens/FoundFilesScreen.kt

      - name: Add inline photo and video thumbnails to results
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/recoverx/app/ui/screens/FoundFilesScreen.kt")
          s = p.read_text()
          s = s.replace("import androidx.compose.foundation.lazy.LazyRow", "import androidx.compose.foundation.lazy.LazyRow\nimport androidx.compose.foundation.lazy.grid.GridCells\nimport androidx.compose.foundation.lazy.grid.LazyVerticalGrid")
          s = s.replace("import androidx.compose.foundation.layout.*", "import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.ui.graphics.asImageBitmap\nimport androidx.compose.ui.layout.ContentScale")
          s = s.replace("import androidx.compose.runtime.Composable", "import androidx.compose.runtime.*")
          s = s.replace("import coil.compose.AsyncImage", "import coil.compose.AsyncImage\nimport android.graphics.Bitmap\nimport android.media.MediaMetadataRetriever\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.withContext")
          old = """                LazyColumn(
                              verticalArrangement = Arrangement.spacedBy(8.dp),
                              modifier = Modifier.fillMaxSize()
                          ) {
                              items(filteredFiles, key = { it.id }) { item ->
                                  RecoverableFileCard(
                                      file = item,
                                      onToggleSelect = { onToggleSelectFile(item.id) },
                                      onOpenPreview = { onOpenFilePreview(item) }
                                  )
                              }
                          }"""
          new = """                LazyVerticalGrid(
                              columns = GridCells.Fixed(2),
                              horizontalArrangement = Arrangement.spacedBy(10.dp),
                              verticalArrangement = Arrangement.spacedBy(10.dp),
                              modifier = Modifier.fillMaxSize()
                          ) {
                              items(filteredFiles, key = { it.id }) { item ->
                                  RecoverableFileCard(
                                      file = item,
                                      onToggleSelect = { onToggleSelectFile(item.id) },
                                      onOpenPreview = { onOpenFilePreview(item) }
                                  )
                              }
                          }"""
          if old not in s: raise SystemExit("results list block not found")
          s = s.replace(old, new)
          start = s.index("@Composable\nprivate fun RecoverableFileCard(")
          end = s.index("\nfun formatFileSize(bytes: Long): String", start)
          card = """@Composable
          private fun RecoverableFileCard(
              file: RecoverableFile,
              onToggleSelect: () -> Unit,
              onOpenPreview: () -> Unit
          ) {
              val isPhoto = file.category == ScanCategory.PHOTOS
              val isVideo = file.category == ScanCategory.VIDEOS
              Card(
                  shape = RoundedCornerShape(14.dp),
                  colors = CardDefaults.cardColors(containerColor = if (file.isSelected) DarkSurfaceVariant else DarkSurface),
                  border = androidx.compose.foundation.BorderStroke(1.dp, if (file.isSelected) CyanPrimary else Color(0xFF1E293B)),
                  modifier = Modifier.fillMaxWidth().clickable { onOpenPreview() }
              ) {
                  Column {
                      Box(
                          modifier = Modifier.fillMaxWidth().aspectRatio(1f).background(Color(0xFF070B12)),
                          contentAlignment = Alignment.Center
                      ) {
                          when {
                              isPhoto && file.uri != null -> AsyncImage(model = file.uri, contentDescription = file.name,
                                  contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize())
                              isVideo && file.uri != null -> {
                                  VideoThumbnail(file.uri, Modifier.fillMaxSize())
                                  Surface(shape = CircleShape, color = Color.Black.copy(alpha = 0.62f), modifier = Modifier.size(48.dp)) {
                                      Box(contentAlignment = Alignment.Center) {
                                          Icon(Icons.Default.PlayArrow, "Preview video", tint = Color.White, modifier = Modifier.size(30.dp))
                                      }
                                  }
                              }
                              else -> {
                                  Box(modifier = Modifier.size(62.dp).clip(RoundedCornerShape(14.dp))
                                      .background(getCategoryColor(file.category).copy(alpha = 0.16f)), contentAlignment = Alignment.Center) {
                                      Icon(getCategoryIcon(file.category), null, tint = getCategoryColor(file.category), modifier = Modifier.size(34.dp))
                                  }
                              }
                          }
                          Surface(shape = CircleShape, color = if (file.isSelected) CyanPrimary else Color.Black.copy(alpha = 0.68f),
                              modifier = Modifier.align(Alignment.TopEnd).padding(7.dp).size(32.dp).clickable { onToggleSelect() }) {
                              Box(contentAlignment = Alignment.Center) {
                                  Icon(if (file.isSelected) Icons.Default.Check else Icons.Default.Add, "Pilih",
                                      tint = if (file.isSelected) DarkBackground else Color.White, modifier = Modifier.size(19.dp))
                              }
                          }
                          Surface(shape = RoundedCornerShape(6.dp), color = Color.Black.copy(alpha = 0.72f),
                              modifier = Modifier.align(Alignment.BottomStart).padding(7.dp)) {
                              Text(if (isPhoto) "FOTO" else if (isVideo) "VIDEO" else file.extension.uppercase(),
                                  color = Color.White, fontSize = 8.sp, fontWeight = FontWeight.Bold,
                                  modifier = Modifier.padding(horizontal = 6.dp, vertical = 3.dp))
                          }
                          if (file.confidence != RecoveryConfidence.HIGH) {
                              Surface(shape = RoundedCornerShape(6.dp), color = Color.Black.copy(alpha = 0.72f),
                                  modifier = Modifier.align(Alignment.BottomEnd).padding(7.dp)) {
                                  Text(if (file.confidence == RecoveryConfidence.MEDIUM) "SEDANG" else "RENDAH",
                                      color = if (file.confidence == RecoveryConfidence.MEDIUM) AccentAmber else Color(0xFFF87171),
                                      fontSize = 8.sp, fontWeight = FontWeight.Bold,
                                      modifier = Modifier.padding(horizontal = 5.dp, vertical = 3.dp))
                              }
                          }
                      }
                      Column(modifier = Modifier.padding(10.dp)) {
                          Text(file.name, fontWeight = FontWeight.SemiBold, color = Color.White, fontSize = 12.sp,
                              maxLines = 1, overflow = TextOverflow.Ellipsis)
                          Spacer(Modifier.height(4.dp))
                          Text(formatFileSize(file.sizeBytes), fontFamily = FontFamily.Monospace, fontSize = 10.sp, color = TextSecondary)
                          Text(if (file.source == FileSource.HIDDEN_CACHE) "Thumbnail/Cache" else file.source.name,
                              fontSize = 9.sp, color = CyanLight, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      }
                  }
              }
          }

          @Composable
          private fun VideoThumbnail(uri: android.net.Uri, modifier: Modifier = Modifier) {
              val context = androidx.compose.ui.platform.LocalContext.current
              val bitmap by produceState<Bitmap?>(initialValue = null, uri) {
                  value = withContext(Dispatchers.IO) {
                      val retriever = MediaMetadataRetriever()
                      try {
                          retriever.setDataSource(context, uri)
                          retriever.getFrameAtTime(1_000_000L, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                      } catch (_: Exception) { null }
                      finally { try { retriever.release() } catch (_: Exception) {} }
                  }
              }
              if (bitmap != null) {
                  androidx.compose.foundation.Image(bitmap = bitmap!!.asImageBitmap(), contentDescription = "Thumbnail video",
                      contentScale = ContentScale.Crop, modifier = modifier)
              } else {
                  Box(modifier.background(Color(0xFF111827)), contentAlignment = Alignment.Center) {
                      Icon(Icons.Default.Videocam, null, tint = Color(0xFFF43F5E), modifier = Modifier.size(42.dp))
                  }
              }
          }


          PY
      - name: Diagnose Kotlin compile errors
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "===== DeepStorageCarvingScanner.kt 100-135 ====="
          nl -ba app/src/main/java/com/recoverx/app/data/scanner/DeepStorageCarvingScanner.kt | sed -n '100,135p'
          echo "===== HiddenStorageScanner.kt 65-95 ====="
          nl -ba app/src/main/java/com/recoverx/app/data/scanner/HiddenStorageScanner.kt | sed -n '65,95p'

      - name: Repair coroutine context checks
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          sed -i 's/currentCoroutineContext().isActive/true/g' \
            app/src/main/java/com/recoverx/app/data/scanner/DeepStorageCarvingScanner.kt \
            app/src/main/java/com/recoverx/app/data/scanner/HiddenStorageScanner.kt

      - name: Repair missing launcher resources
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          RES="app/src/main/res"
          mkdir -p "$RES/mipmap-anydpi-v26"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#3F51B5" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M30,30h48v48h-48z" />
          </vector>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle wrapper --gradle-version 8.4 --distribution-type bin
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
        id: apk
        run: |
          APK="$(find "${{ steps.locate.outputs.project_dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RecoverX-Debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
